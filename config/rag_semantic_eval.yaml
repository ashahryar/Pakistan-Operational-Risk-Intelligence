# Task 30 -- evaluation set for semantic vs lexical retrieval over the REAL local corpus (253 documents / 1,909 chunks).
# A chunk counts as RELEVANT to a case when its verbatim text contains at least one of `relevant_terms` (case-insensitive
# substring). The terms describe the concept the query paraphrases; they were chosen from the project's own report vocabulary
# (e.g. NDMA/PDMA wording), and the top results of every case are printed to the evaluation report so a human can verify them.
# The paraphrase queries were fixed BEFORE any semantic result was seen and are not tuned to the model.
# `no_query_word_in_corpus` is computed, not asserted: it lists the query words that never occur in the corpus.
version: 1
k: 5
cases:
  # ---- event queries phrased differently from the report wording
  - {id: slope_collapse, category: event_paraphrase, query: "mountain slope collapse blocking highways",
     relevant_terms: ["landslide", "road blocked", "traffic suspended", "slide"]}
  - {id: rivers_bursting, category: event_paraphrase, query: "rivers bursting their banks",
     relevant_terms: ["flood", "overflow", "flooding"]}
  - {id: scorching_heat, category: event_paraphrase, query: "scorching temperatures across the plains",
     relevant_terms: ["heatwave", "heat wave", "hot"]}
  - {id: lives_lost, category: event_paraphrase, query: "people who lost their lives",
     relevant_terms: ["deaths", "died", "death", "fatalit", "killed"]}
  - {id: destroyed_dwellings, category: event_paraphrase, query: "destroyed dwellings and residences",
     relevant_terms: ["houses", "house", "damaged"]}
  - {id: glacier_lake, category: event_paraphrase, query: "melting ice lake burst threatening villages",
     relevant_terms: ["glof", "glacial", "glacier"]}
  - {id: sudden_downpour, category: event_paraphrase, query: "sudden intense rainfall in a small area",
     relevant_terms: ["cloudburst", "heavy rain", "heavy falls", "very heavy"]}
  # ---- warning / advisory
  - {id: advance_notice, category: advisory, query: "advance notice of severe downpour",
     relevant_terms: ["advisory", "alert", "warning", "expected"]}
  # ---- geography
  - {id: geo_swat, category: geographic, query: "what happened in Swat", relevant_terms: ["swat"]}
  - {id: geo_chitral, category: geographic, query: "Chitral situation report", relevant_terms: ["chitral"]}
  # ---- filters (compliance is checked on every returned result)
  - {id: source_ndma, category: source, query: "flood", filters: {source: ndma}, relevant_terms: ["flood"]}
  - {id: source_pdma, category: source, query: "rain expected in districts", filters: {source: pdma}, relevant_terms: ["rain"]}
  - {id: date_july, category: date, query: "flood", filters: {date_from: "2026-07-01", date_to: "2026-07-31"}, relevant_terms: ["flood"]}
  # ---- unsupported topics: a calibrated threshold should leave these without results
  - {id: empty_finance, category: empty, query: "quarterly corporate earnings per share", relevant_terms: []}
  - {id: empty_sport, category: empty, query: "football world cup final score", relevant_terms: []}
  - {id: empty_recipe, category: empty, query: "how to bake a chocolate cake", relevant_terms: []}

  # =====================================================================================================================
  # Task 31 additions (the 16 cases above are unchanged). Written and frozen BEFORE hybrid retrieval was run on them: only the
  # corpus vocabulary was checked (that each name/term occurs in at least a few chunks, so a case can have relevant results at all).
  # No threshold, constant or query was changed after seeing results. Still a small HEURISTIC evaluation: relevance is a substring
  # judge, there is one judge and one run, cases are not independent samples.
  # =====================================================================================================================
  # ---- exact Pakistani place names (towns / valleys)
  - {id: place_skardu, category: exact_place, query: "Skardu", relevant_terms: ["skardu"]}
  - {id: place_peshawar, category: exact_place, query: "Peshawar", relevant_terms: ["peshawar"]}
  - {id: place_quetta, category: exact_place, query: "flood situation in Quetta", relevant_terms: ["quetta"]}
  - {id: place_neelum, category: exact_place, query: "Neelum valley", relevant_terms: ["neelum"]}
  - {id: place_diamer, category: exact_place, query: "Diamer", relevant_terms: ["diamer"]}
  # ---- district names
  - {id: district_rajanpur, category: district, query: "Rajanpur", relevant_terms: ["rajanpur"]}
  - {id: district_buner, category: district, query: "Buner district", relevant_terms: ["buner"]}
  - {id: district_kohistan, category: district, query: "Kohistan", relevant_terms: ["kohistan"]}
  # ---- province names
  - {id: province_balochistan, category: province, query: "Balochistan", relevant_terms: ["balochistan"]}
  - {id: province_gb, category: province, query: "Gilgit-Baltistan", relevant_terms: ["gilgit"]}
  - {id: province_kp, category: province, query: "Khyber Pakhtunkhwa", relevant_terms: ["khyber"]}
  # ---- disaster terms (the report's own wording)
  - {id: term_landslide, category: disaster_term, query: "landslide", relevant_terms: ["landslide"]}
  - {id: term_flash_flood, category: disaster_term, query: "flash flood", relevant_terms: ["flash flood"]}
  - {id: term_hailstorm, category: disaster_term, query: "hailstorm", relevant_terms: ["hailstorm"]}
  - {id: term_dengue, category: disaster_term, query: "dengue", relevant_terms: ["dengue"]}
  # ---- paraphrased disaster statements
  - {id: para_livestock, category: paraphrase, query: "animals that perished in the disaster", relevant_terms: ["livestock", "cattle", "animal"]}
  - {id: para_crops, category: paraphrase, query: "farmland and harvest destroyed", relevant_terms: ["crop", "agricultur"]}
  - {id: para_evacuation, category: paraphrase, query: "residents moved to safer places", relevant_terms: ["evacuat", "rescued", "relief camp", "shelter"]}
  - {id: para_bridges, category: paraphrase, query: "washed out river crossings", relevant_terms: ["bridge"]}
  # ---- advisory language
  - {id: adv_precautions, category: advisory_lang, query: "authorities urge people to take precautions", relevant_terms: ["precaution", "advisory", "alert"]}
  - {id: adv_monsoon, category: advisory_lang, query: "forecast of monsoon rains next week", relevant_terms: ["monsoon", "forecast", "expected"]}
  # ---- casualty language
  - {id: cas_injured, category: casualty, query: "number of people hurt", relevant_terms: ["injured", "injur"]}
  - {id: cas_fatalities, category: casualty, query: "fatalities caused by floods", relevant_terms: ["death", "died", "fatalit", "killed"]}
  # ---- infrastructure damage
  - {id: infra_roads, category: infrastructure, query: "roads damaged and blocked", relevant_terms: ["road"]}
  - {id: infra_homes, category: infrastructure, query: "homes partially or fully damaged", relevant_terms: ["house", "damaged"]}
  - {id: infra_power, category: infrastructure, query: "power supply disrupted", relevant_terms: ["electricity", "power"]}
  # ---- unsupported questions (no relevant chunk can exist; any result is junk)
  - {id: empty_crypto, category: empty, query: "bitcoin price prediction", relevant_terms: []}
  - {id: empty_movies, category: empty, query: "best actor oscar winners", relevant_terms: []}
  - {id: empty_programming, category: empty, query: "python list comprehension syntax", relevant_terms: []}
  - {id: empty_hurricane, category: empty, query: "hurricane damage in Florida", relevant_terms: []}

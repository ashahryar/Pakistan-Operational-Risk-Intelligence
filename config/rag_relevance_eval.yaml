# Task 35 -- frozen evaluation set for the RAG RELEVANCE / ABSTENTION policy. It EXTENDS config/rag_semantic_eval.yaml (the 39 Task 30-31 cases are included
# unchanged via `include`); nothing in the included file was edited.
#
# Case groups (derived, not asserted):
#   supported           has `relevant_terms`: a chunk is RELEVANT if its verbatim text contains one of them (case-insensitive substring; one judge, heuristic)
#   unsupported         category `empty` (base file) or `unsupported` (below): no relevant chunk can exist; the system must abstain
#   difficult_negative  category `difficult_negative`: written with words that are FREQUENT in the corpus (NDMA, report, Sindh, Punjab, flood, relief ...) but whose
#                       requested concept is absent. `absent_terms` lists words that must have ZERO occurrences in the corpus; the harness VERIFIES that and marks a case
#                       INVALID (excluded and reported) if any of them occurs. No corpus evidence is fabricated.
#
# Development / holdout split: within each group, cases are taken in file order (base file first) and ASSIGNED ALTERNATELY: 1st dev, 2nd holdout, 3rd dev ...
# The rule is deterministic and was fixed BEFORE any score was computed. Thresholds are SELECTED on the dev cases only and then REPORTED once on the holdout cases.
# The new cases below were written from the corpus vocabulary (presence of each relevant term in several chunks / absence of each absent term was checked), not from
# any retrieval score. Small, one author, substring judge: a development evaluation, not a statistically strong benchmark.
version: 1
include: rag_semantic_eval.yaml
k: 5

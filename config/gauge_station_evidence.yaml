# Task 24/25 -- repository-managed station evidence REGISTRY for gauge geography.
#
# Records evidence, never conclusions. gauge_mapping.py turns evidence into a mapping status; the
# eligibility POLICY lives in config/admin_boundary_sources.yaml (policy:), not in code.
#
# evidence_status:
#   authoritative      the OFFICIAL OWNER of the station explicitly states the district / coordinates.
#   official_secondary an official document that merely mentions another agency's station.
#   secondary          non-official reference (encyclopedia / news). Never eligible.
#   conflicting        sources disagree (also derived automatically when entries name different districts).
#   unresolved         source seen, nothing usable.
# A government-looking website is NOT automatically authoritative: the source must state the fact.
#
# Coordinates: only populate latitude/longitude from an authoritative source; they are validated
# (range, Pakistan plausibility, reversal, precision, duplicates) and run through the boundary dataset.
mapping_version: "gauge-geo-3.0.0"
mapping_date: "2026-10-07"
validation_status: pending_manual_review


version: "3.9"

x-airflow-common: &airflow-common

  build:
    context: .
    dockerfile: Dockerfile

  env_file:
    - .env.docker

  environment:

    ####################################
    ## AIRFLOW
    ####################################

    AIRFLOW_HOME: /opt/airflow
    AIRFLOW_UID: 50000

    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"

    AIRFLOW__CORE__FERNET_KEY: ""

    AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: 120
    AIRFLOW__CORE__DAG_FILE_PROCESSOR_TIMEOUT: 120

    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow

    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}

    AIRFLOW__LOGGING__BASE_LOG_FOLDER: /opt/airflow/logs
    AIRFLOW__LOGGING__REMOTE_LOGGING: "False"
    AIRFLOW__LOGGING__LOGGING_LEVEL: INFO

    ####################################
    ## PROJECT
    ####################################

    PROJECT_ROOT: /opt/project

    PYTHONPATH: /opt/project

  working_dir: /opt/project

  volumes:

    ####################################
    ## AIRFLOW
    ####################################

    - ./pipeline/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs

    ####################################
    ## PROJECT
    ####################################

    - ./pipeline:/opt/project/pipeline
    - ./scripts:/opt/project/scripts
    - ./config:/opt/project/config
    - ./validation:/opt/project/validation
    - ./aws:/opt/project/aws
    - ./dashboard:/opt/project/dashboard
    - ./data:/opt/project/data
    - ./logs:/opt/project/logs

    ####################################
    ## ROOT FILES
    ####################################

    - ./.env:/opt/project/.env
    - ./requirements.txt:/opt/project/requirements.txt
    - ./README.md:/opt/project/README.md

  depends_on:
    postgres:
      condition: service_healthy

############################################################
############################################################

services:

  postgres:

    image: postgres:15

    container_name: airflow_postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    ports:
      - "5433:5432"

    volumes:
      - postgres-db-volume:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 10

############################################################

  airflow-init:

    <<: *airflow-common

    container_name: airflow_init

    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
      --username admin
      --password admin
      --firstname Shahryar
      --lastname Ahmed
      --role Admin
      --email admin@example.com
      || true
      "

############################################################

  airflow-webserver:

    <<: *airflow-common

    container_name: airflow_webserver

    command: airflow webserver

    restart: unless-stopped

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    ports:
      - "8088:8080"

############################################################

  airflow-scheduler:

    <<: *airflow-common

    container_name: airflow_scheduler

    command: airflow scheduler

    restart: unless-stopped

    depends_on:
      airflow-init:
        condition: service_completed_successfully

############################################################

volumes:

  postgres-db-volume:
version: "3.9"

x-airflow-common: &airflow-common

  build:
    context: .
    dockerfile: Dockerfile

  env_file:
    - .env.docker

  environment:

    ####################################
    ## AIRFLOW
    ####################################

    AIRFLOW_HOME: /opt/airflow
    AIRFLOW_UID: 50000

    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"

    AIRFLOW__CORE__FERNET_KEY: ""

    AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: 120
    AIRFLOW__CORE__DAG_FILE_PROCESSOR_TIMEOUT: 120

    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow

    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}

    AIRFLOW__LOGGING__BASE_LOG_FOLDER: /opt/airflow/logs
    AIRFLOW__LOGGING__REMOTE_LOGGING: "False"
    AIRFLOW__LOGGING__LOGGING_LEVEL: INFO

    ####################################
    ## PROJECT
    ####################################

    PROJECT_ROOT: /opt/project

    PYTHONPATH: /opt/project

  working_dir: /opt/project

  volumes:

    ####################################
    ## AIRFLOW
    ####################################

    - ./pipeline/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs

    ####################################
    ## PROJECT
    ####################################

    - ./pipeline:/opt/project/pipeline
    - ./scripts:/opt/project/scripts
    - ./config:/opt/project/config
    - ./validation:/opt/project/validation
    - ./aws:/opt/project/aws
    - ./dashboard:/opt/project/dashboard
    - ./data:/opt/project/data
    - ./logs:/opt/project/logs

    ####################################
    ## ROOT FILES
    ####################################

    - ./.env:/opt/project/.env
    - ./requirements.txt:/opt/project/requirements.txt
    - ./README.md:/opt/project/README.md
    - ./tests:/opt/project/tests
    - ./pytest.ini:/opt/project/pytest.ini

  depends_on:
    postgres:
      condition: service_healthy

############################################################
############################################################

services:

  postgres:

    image: postgres:15

    container_name: airflow_postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    ports:
      - "5433:5432"

    volumes:
      - postgres-db-volume:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 10

############################################################

  airflow-init:

    <<: *airflow-common

    container_name: airflow_init

    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
      --username admin
      --password admin
      --firstname Shahryar
      --lastname Ahmed
      --role Admin
      --email admin@example.com
      || true
      "

############################################################

  airflow-webserver:

    <<: *airflow-common

    container_name: airflow_webserver

    command: airflow webserver

    restart: unless-stopped

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    ports:
      - "8088:8080"

############################################################

  airflow-scheduler:

    <<: *airflow-common

    container_name: airflow_scheduler

    command: airflow scheduler

    restart: unless-stopped

    depends_on:
      airflow-init:
        condition: service_completed_successfully

############################################################

  # ----------------------------------------------------------
  # Task 28 -- serving layer: PostgreSQL -> FastAPI -> Streamlit
  # Start only these (leaves the Airflow services untouched):
  #   docker compose up -d --build api dashboard
  # ----------------------------------------------------------

  api:

    build:
      context: .
      dockerfile: api/Dockerfile
      args:
        # false = lexical-only API image (no ONNX runtime / model); CI uses this to avoid model downloads
        INSTALL_EMBEDDINGS: ${API_EMBEDDINGS:-true}

    container_name: pori_api

    restart: unless-stopped

    # DB_HOST=postgres / DB_PORT=5432 / DB_NAME / DB_USER / DB_PASSWORD (same non-secret values the Airflow stack uses)
    env_file:
      - .env.docker

    ports:
      - "${API_PORT:-8000}:8000"

    depends_on:
      postgres:
        condition: service_healthy

    # Healthy only when /health answers 200 AND reports the database reachable (status "ok"), not merely when the process exists.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,sys,urllib.request; r=json.load(urllib.request.urlopen('http://localhost:8000/health', timeout=4)); sys.exit(0 if r.get('status')=='ok' and r.get('database') else 1)"
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 10s

############################################################

  dashboard:

    build:
      context: .
      dockerfile: dashboard/Dockerfile

    container_name: pori_dashboard

    restart: unless-stopped

    env_file:
      - .env.docker

    environment:
      # Compose-network address of the API service. A dashboard run on the host keeps using PORI_API_URL / its localhost default.
      PORI_API_URL: http://api:8000

    # host port is configurable so it does not clash with a dashboard already running on the host (streamlit run)
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"

    depends_on:
      api:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=4)"
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 20s

############################################################

volumes:

  postgres-db-volume:
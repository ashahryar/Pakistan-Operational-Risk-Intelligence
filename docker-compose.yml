version: "3.9"

x-airflow-common: &airflow-common

  build:
    context: .
    dockerfile: Dockerfile

  env_file:
    - .env.docker

  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"

    AIRFLOW__CORE__FERNET_KEY: ""

    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow

    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}

    AIRFLOW__LOGGING__BASE_LOG_FOLDER: /opt/airflow/logs
    AIRFLOW__LOGGING__REMOTE_LOGGING: "False"
    AIRFLOW__LOGGING__LOGGING_LEVEL: INFO

    AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: 120
    AIRFLOW__CORE__DAG_FILE_PROCESSOR_TIMEOUT: 120

    PYTHONPATH: /opt/project
    AIRFLOW_UID: 50000

  volumes:

    # Airflow DAGs
    - ./airflow/dags:/opt/airflow/dags

    # Airflow Modules
    - ./airflow/helpers:/opt/project/airflow/helpers
    - ./airflow/utils:/opt/project/airflow/utils
    - ./airflow/sensors:/opt/project/airflow/sensors
    - ./airflow/config:/opt/project/airflow/config

    # Project
    - ./scripts:/opt/project/scripts
    - ./aws:/opt/project/aws
    - ./config:/opt/project/config
    - ./dashboard:/opt/project/dashboard
    - ./data:/opt/project/data
    - ./logs:/opt/project/logs

    # Airflow Task Logs
    - ./airflow/logs:/opt/airflow/logs

    # Environment
    - ./.env:/opt/project/.env

  depends_on:
    postgres:
      condition: service_healthy

services:

  postgres:

    image: postgres:15

    container_name: airflow_postgres

    restart: always

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    ports:
      - "5433:5432"

    volumes:
      - postgres-db-volume:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 10

  airflow-init:

    <<: *airflow-common

    container_name: airflow_init

    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
      --username admin
      --password admin
      --firstname Shahryar
      --lastname Ahmed
      --role Admin
      --email admin@example.com
      || true
      "

  airflow-webserver:

    <<: *airflow-common

    container_name: airflow_webserver

    command: airflow webserver

    restart: always

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    ports:
      - "8088:8080"

  airflow-scheduler:

    <<: *airflow-common

    container_name: airflow_scheduler

    command: airflow scheduler

    restart: always

    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:

  postgres-db-volume:
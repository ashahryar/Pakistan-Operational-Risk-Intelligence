[pytest]
testpaths = tests databricks/tests api/tests
markers =
    real_model: needs the real embedding runtime + cached model weights (integration tests; skipped when they are unavailable, e.g. in CI)
    live_embeddings: needs the stored corpus embeddings in the local database

; Phase 1 / Task 7 (ADR-0001): these tests need the real `airflow` package
; and the real /opt/airflow/dags mount, neither of which exist on the bare
; host. Run them inside the airflow_webserver (or airflow_scheduler)
; container:
;
;   docker exec -w /opt/project -e PYTHONPATH=/opt/project airflow_webserver \
;       pytest tests/test_dag_integrity.py -v
